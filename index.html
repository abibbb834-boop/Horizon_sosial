<!DOCTYPE html>
<html lang="id">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Horizon Social</title>

<style>

body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#111;
    color:white;
    font-family:Arial;
}

.box{
    text-align:center;
    background:#222;
    padding:30px;
    border-radius:15px;
}

h1{
    color:#1da1f2;
}

button{
    padding:12px 25px;
    margin:5px;
    border:none;
    border-radius:8px;
    background:#1da1f2;
    color:white;
    font-size:16px;
}

button:hover{
    background:#0d8ae6;
}

</style>

</head>


<body>


<div class="box">

<h1>🌐 Horizon Social</h1>

<p>Selamat datang di Horizon Social</p>


<button onclick="login()">
Login
</button>


<button onclick="register()">
Register
</button>


</div>



<script>

function login(){

window.location="login.html";

}


function register(){

window.location="register.html";

}

</script>


</body>

</html>
